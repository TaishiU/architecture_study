name: Flutter CI

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v6

      - name: Flutterのセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Flutterバージョン確認
        run: flutter --version

      - name: Flutter SDKのパスを環境変数に追加
        run: echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Pubキャッシュの復元
        uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutterクリーン
        run: flutter clean

      - name: Dart/Flutterの依存関係を取得
        run: flutter pub get

      - name: widgetbookのDart/Flutterの依存関係を取得
        run: |
          cd widgetbook
          flutter pub get

      - name: Dartコードの修正
        run: dart fix --apply .

      - name: Dartコードのフォーマット
        run: dart format .

      - name: Dartコードの解析
        run: dart analyze

      - name: widgetbookのDartコードの解析
        run: |
          cd widgetbook
          dart analyze

      - name: Flutterコードの解析
        run: flutter analyze

      - name: テストの実行とカバレッジレポートの生成
        run: flutter test --coverage

      - name: Slack通知
        if: ${{ always() }}
        uses: slackapi/slack-github-action@v3.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub Action build result*: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action build result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
