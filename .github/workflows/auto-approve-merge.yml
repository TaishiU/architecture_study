name: Auto approve and merge

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

# 必要な権限
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve-merge:
    runs-on: ubuntu-latest
    # 自分自身の PR の場合のみ実行（他者からの PR は対象外）
    if: github.actor == github.repository_owner
    steps:
      # 既存の CI がパスするまで待機するため、needs で依存させるのは不要
      # （auto-merge 機能側が CI のパスを待ってくれるため）

      - name: Approve and enable auto-merge
        run: |
          # 承認レビューを付与
          gh pr review "${{ github.event.number }}" --approve
          # auto-merge を有効化（Squash マージ）
          gh pr merge "${{ github.event.number }}" --auto --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}